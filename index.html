<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Enrolamiento Biométrico</title>

<script
  defer
  src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 20px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f2f4f7;

  color: #1f2937;

}

.contenedor {

  width: 100%;
  max-width: 700px;

  margin: 0 auto;

  background: white;

  border-radius: 16px;

  padding: 25px;

  box-shadow:
    0 4px 20px
    rgba(0,0,0,0.10);

}

h1 {

  margin: 0 0 8px;

  text-align: center;

  font-size: 28px;

}

.subtitulo {

  text-align: center;

  color: #6b7280;

  margin-bottom: 25px;

}

label {

  display: block;

  font-weight: bold;

  margin-bottom: 8px;

}

select,
button {

  width: 100%;

  padding: 14px;

  border-radius: 10px;

  font-size: 16px;

}

select {

  border:
    1px solid #d1d5db;

  background: white;

  margin-bottom: 15px;

}

button {

  border: none;

  background: #111827;

  color: white;

  font-weight: bold;

  cursor: pointer;

  margin-top: 10px;

}

button:disabled {

  background: #9ca3af;

  cursor: not-allowed;

}

.camara {

  position: relative;

  width: 100%;

  margin-top: 20px;

  background: #111;

  border-radius: 14px;

  overflow: hidden;

  min-height: 300px;

  display: flex;

  justify-content: center;

  align-items: center;

}

video {

  width: 100%;

  max-height: 500px;

  object-fit: cover;

  display: none;

  transform: scaleX(-1);

}

.mensaje {

  margin-top: 18px;

  padding: 14px;

  border-radius: 10px;

  text-align: center;

  font-weight: bold;

  background: #eef2ff;

  color: #3730a3;

}

.exito {

  background: #dcfce7;

  color: #166534;

}

.error {

  background: #fee2e2;

  color: #991b1b;

}

.estado {

  text-align: center;

  margin-top: 15px;

  font-size: 14px;

  color: #6b7280;

}

.resultado {

  margin-top: 15px;

  padding: 15px;

  background: #f3f4f6;

  border-radius: 10px;

  display: none;

}

.instrucciones {

  margin-top: 20px;

  padding: 15px;

  background: #f9fafb;

  border-radius: 10px;

  font-size: 14px;

  line-height: 1.5;

}

</style>

</head>


<body>


<div class="contenedor">


<h1>
🔐 Enrolamiento Biométrico
</h1>


<div class="subtitulo">
Registro facial del trabajador
</div>


<label for="personal">
Seleccionar trabajador
</label>


<select id="personal">

<option value="">
Cargando trabajadores...
</option>

</select>


<button
id="btnCamara"
disabled
>

📷 ACTIVAR CÁMARA

</button>


<div class="camara">

<video
id="video"
autoplay
muted
playsinline
></video>

</div>


<div
id="estado"
class="estado"
>

Preparando sistema...

</div>


<div
id="mensaje"
class="mensaje"
>

Cargando trabajadores...

</div>


<div
id="resultado"
class="resultado"
>

</div>


<div class="instrucciones">

<strong>
Recomendaciones:
</strong>

<br>

• Coloca tu rostro frente a la cámara.

<br>

• Mantén una iluminación adecuada.

<br>

• Mira directamente a la cámara.

<br>

• Mantén el rostro dentro del encuadre.

</div>


</div>


<script>


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbx-ahXOqPqd1vIDsSH1YaRerx7Wo0hULU6beekVHNqZGLsHUkcVQfmC5UAkq-uPOghC/exec";


const URL_MODELOS =
"https://justadudewhohacks.github.io/face-api.js/models";


/* =====================================================
   ELEMENTOS
===================================================== */

const personalSelect =
document.getElementById("personal");

const btnCamara =
document.getElementById("btnCamara");

const video =
document.getElementById("video");

const mensaje =
document.getElementById("mensaje");

const estado =
document.getElementById("estado");

const resultado =
document.getElementById("resultado");


/* =====================================================
   VARIABLES
===================================================== */

let trabajadores = [];

let stream = null;

let camaraActiva = false;

let modelosCargados = false;

let deteccionInterval = null;


/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(
texto,
tipo = ""
) {

mensaje.textContent = texto;

mensaje.className =
"mensaje";


if (tipo === "exito") {

mensaje.classList.add(
"exito"
);

}


if (tipo === "error") {

mensaje.classList.add(
"error"
);

}

}


/* =====================================================
   JSONP PERSONAL
===================================================== */

window.recibirPersonal =
function(datos) {

trabajadores =
datos;


personalSelect.innerHTML =
'<option value="">Seleccione un trabajador</option>';


trabajadores.forEach(
function(persona) {

const opcion =
document.createElement(
"option"
);


opcion.value =
persona.idPersonal;


opcion.textContent =
persona.nombre +
" - " +
persona.idPersonal;


personalSelect.appendChild(
opcion
);

});


btnCamara.disabled =
false;


estado.textContent =
"Sistema listo.";


mostrarMensaje(
trabajadores.length +
" trabajador(es) cargado(s) correctamente.",
"exito"
);

};


/* =====================================================
   CARGAR PERSONAL
===================================================== */

function cargarTrabajadores() {

const script =
document.createElement(
"script"
);


script.src =
URL_APPS_SCRIPT +
"?accion=personalEnrolamiento" +
"&callback=recibirPersonal" +
"&t=" +
Date.now();


script.onerror =
function() {

mostrarMensaje(
"No se pudo conectar con Apps Script.",
"error"
);

estado.textContent =
"Error de conexión.";

};


document.body.appendChild(
script
);

}


/* =====================================================
   CARGAR MODELOS
===================================================== */

async function cargarModelos() {

if (modelosCargados) {
return;
}


estado.textContent =
"Cargando reconocimiento facial...";


await faceapi.nets.tinyFaceDetector.loadFromUri(
URL_MODELOS
);


await faceapi.nets.faceLandmark68Net.loadFromUri(
URL_MODELOS
);


await faceapi.nets.faceRecognitionNet.loadFromUri(
URL_MODELOS
);


modelosCargados =
true;


estado.textContent =
"Reconocimiento facial listo.";

}


/* =====================================================
   ACTIVAR CÁMARA
===================================================== */

async function activarCamara() {

try {


if (!personalSelect.value) {

mostrarMensaje(
"Primero selecciona un trabajador.",
"error"
);

return;

}


btnCamara.disabled =
true;


await cargarModelos();


stream =
await navigator.mediaDevices.getUserMedia({

video: {

facingMode: {
ideal: "user"
},

width: {
ideal: 640
},

height: {
ideal: 480
}

},

audio: false

});


video.srcObject =
stream;


video.style.display =
"block";


camaraActiva =
true;


btnCamara.textContent =
"📷 CÁMARA ACTIVADA";


mostrarMensaje(
"Cámara activada correctamente.",
"exito"
);


estado.textContent =
"Buscando rostro...";


iniciarDeteccion();


} catch(error) {


console.error(error);


btnCamara.disabled =
false;


mostrarMensaje(
"No se pudo activar la cámara: " +
error.message,
"error"
);


estado.textContent =
"Error de cámara.";

}

}


/* =====================================================
   DETECCIÓN
===================================================== */

function iniciarDeteccion() {

if (deteccionInterval) {

clearInterval(
deteccionInterval
);

}


deteccionInterval =
setInterval(
detectarRostro,
1200
);

}


/* =====================================================
   DETECTAR Y GUARDAR
===================================================== */

async function detectarRostro() {

if (!camaraActiva) {
return;
}


if (!video.videoWidth) {
return;
}


try {


const deteccion =
await faceapi
.detectSingleFace(
video,
new faceapi.TinyFaceDetectorOptions({
inputSize: 320,
scoreThreshold: 0.5
})
)
.withFaceLandmarks()
.withFaceDescriptor();


if (!deteccion) {

estado.textContent =
"Buscando rostro...";

return;

}


/* -----------------------------------------------
   ROSTRO ENCONTRADO
------------------------------------------------ */

estado.textContent =
"✅ Rostro detectado.";


mostrarMensaje(
"Rostro detectado. Preparando registro...",
"exito"
);


const descriptor =
Array.from(
deteccion.descriptor
);


console.log(
"Descriptor:",
descriptor
);


console.log(
"Cantidad:",
descriptor.length
);


/* -----------------------------------------------
   VALIDAR
------------------------------------------------ */

if (
descriptor.length !== 128
) {

throw new Error(
"El descriptor no contiene 128 valores."
);

}


/* -----------------------------------------------
   DETENER DETECCIÓN
------------------------------------------------ */

clearInterval(
deteccionInterval
);


/* -----------------------------------------------
   GUARDAR
------------------------------------------------ */

await guardarDescriptor(
personalSelect.value,
descriptor
);


} catch(error) {

console.error(error);


mostrarMensaje(
"Error: " +
error.message,
"error"
);

}

}


/* =====================================================
   GUARDAR DESCRIPTOR MEDIANTE POST
===================================================== */

function guardarDescriptor(
idPersonal,
descriptor
) {

return new Promise(
function(resolve, reject) {


mostrarMensaje(
"Guardando descriptor facial..."
);


estado.textContent =
"Enviando biometría al servidor...";


/*
  Formulario oculto.

  No usamos fetch.
  No usamos CORS.
  No ponemos el descriptor en la URL.
*/

const iframe =
document.createElement(
"iframe"
);


iframe.name =
"biometria_" +
Date.now();


iframe.style.display =
"none";


document.body.appendChild(
iframe
);


const form =
document.createElement(
"form"
);


form.method =
"POST";


form.action =
URL_APPS_SCRIPT;


form.target =
iframe.name;


form.style.display =
"none";


/*
  Acción
*/

const inputAccion =
document.createElement(
"input"
);

inputAccion.type =
"hidden";

inputAccion.name =
"accion";

inputAccion.value =
"guardarBiometria";

form.appendChild(
inputAccion
);


/*
  ID PERSONAL
*/

const inputPersonal =
document.createElement(
"input"
);

inputPersonal.type =
"hidden";

inputPersonal.name =
"idPersonal";

inputPersonal.value =
idPersonal;

form.appendChild(
inputPersonal
);


/*
  DESCRIPTOR
*/

const inputDescriptor =
document.createElement(
"input"
);

inputDescriptor.type =
"hidden";

inputDescriptor.name =
"descriptor";

inputDescriptor.value =
JSON.stringify(
descriptor
);

form.appendChild(
inputDescriptor
);


/*
  Evento de carga del iframe.
*/

iframe.onload =
function() {

console.log(
"Respuesta del servidor recibida."
);


mostrarMensaje(
"✅ Biometría enviada correctamente.",
"exito"
);


estado.textContent =
"Registro biométrico completado.";


resultado.style.display =
"block";


resultado.innerHTML =
"<strong>BIOMETRÍA REGISTRADA</strong>" +
"<br>" +
"Trabajador: " +
idPersonal +
"<br>" +
"Descriptor: 128 valores";


/*
  Detener cámara
*/

detenerCamara();


resolve();

};


/*
  Agregar formulario
*/

document.body.appendChild(
form
);


/*
  Enviar
*/

form.submit();


/*
  Limpiar elementos después
*/

setTimeout(
function() {

try {

document.body.removeChild(
form
);

document.body.removeChild(
iframe
);

} catch(error) {}

},
10000
);


});

}


/* =====================================================
   DETENER CÁMARA
===================================================== */

function detenerCamara() {

if (!stream) {
return;
}


stream
.getTracks()
.forEach(
function(track) {

track.stop();

});


video.srcObject =
null;


camaraActiva =
false;


video.style.display =
"none";


btnCamara.disabled =
false;


btnCamara.textContent =
"📷 ACTIVAR CÁMARA";

}


/* =====================================================
   CAMBIO DE TRABAJADOR
===================================================== */

personalSelect.addEventListener(
"change",
function() {

resultado.style.display =
"none";


if (personalSelect.value) {

const trabajador =
trabajadores.find(
function(persona) {

return String(
persona.idPersonal
) === String(
personalSelect.value
);

});


if (trabajador) {

mostrarMensaje(
"Trabajador seleccionado: " +
trabajador.nombre
);

}


estado.textContent =
"Listo para activar cámara.";

}

});


/* =====================================================
   BOTÓN
===================================================== */

btnCamara.addEventListener(
"click",
activarCamara
);


/* =====================================================
   INICIO
===================================================== */

window.addEventListener(
"load",
function() {

if (
typeof faceapi ===
"undefined"
) {

mostrarMensaje(
"No se pudo cargar Face API.",
"error"
);

return;

}


cargarTrabajadores();

});


</script>

</body>

</html>
